[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "abstractcybersim-workbench"
version = "0.1.0"
description = "Local research workbench for offensive cyber agent organizations"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
research = "backend.app.cli:main"

[tool.setuptools.packages.find]
include = ["backend*", "packages.contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: CybORG software integration checks (not research experiments)"]
